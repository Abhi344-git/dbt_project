version: 2

sources:
  - name: DBT_Citi_1
    description: "Transaction source table."

    database: SN_CITI_1
    schema: landing

    # freshness:
    #   warn_after:
    #     count: 1
    #     period: day
    #   error_after:
    #     count: 2
    #     period: day

    # loaded_at_field: TRANSACTION_DATE

    tables:
      - name: F_TRANS_L
        description: "Source transaction table."

        columns:
          - name: TRANSACTION_ID
            tests:
              - not_null:
                  config:
                    severity: warn

          - name: CUSTOMER_ID
            tests:
              - not_null:
                  config:
                    severity: warn

          - name: BRANCH_ID
            tests:
              - not_null:
                  config:
                    severity: warn

          - name: AMOUNT
            tests:
              - not_null:
                  config:
                    severity: warn

              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 0
                    max_value: 1000000
                  config:
                    severity: warn

          - name: TRANSACTION_TYPE
            tests:
              - accepted_values:
                  arguments:
                    values:
                      - DEBIT
                      - CREDIT
                  config:
                    severity: warn

          - name: TRANSACTION_DATE
            tests:
              - not_null:
                  config:
                    severity: warn

          - name: CURRENCY
            tests:
              - accepted_values:
                  arguments:
                    values:
                      - INR
                      - USD
                      - EUR
                  config:
                    severity: warn