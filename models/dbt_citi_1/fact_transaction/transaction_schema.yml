version: 2

models:
  - name: f_transaction_bronze
    description: >
      Bronze layer table storing raw transaction data loaded from
      SN_CITI_1.FACT.F_TRANSACTION with audit columns.

    config:
      database: DBT_CITI_1
      schema: F_TRANSACTION

    columns:

      - name: TRANSACTION_ID
        description: Unique transaction identifier.
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn

      - name: CUSTOMER_ID
        description: Customer identifier.
        tests:
          - not_null:
              config:
                severity: warn

      - name: BRANCH_ID
        description: Branch identifier.
        tests:
          - not_null:
              config:
                severity: warn

      - name: AMOUNT
        description: Transaction amount.
        tests:
          - not_null:
              config:
                severity: warn

          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
              config:
                severity: warn

      - name: TRANSACTION_TYPE
        description: Type of transaction.
        tests:
          - accepted_values:
              arguments:
                values:
                  - DEBIT
                  - CREDIT
              config:
                severity: warn

      - name: TRANSACTION_DATE
        description: Transaction date and time.
        tests:
          - not_null:
              config:
                severity: warn

      - name: CURRENCY
        description: Currency code.
        tests:
          - accepted_values:
              arguments:
                values:
                  - INR
                  - USD
                  - EUR
              config:
                severity: warn

      - name: INGESTED_AT
        description: Timestamp when the record was loaded into Bronze.
        tests:
          - not_null:
              config:
                severity: warn

      - name: BATCH_ID
        description: dbt invocation ID used for audit.
        tests:
          - not_null:
              config:
                severity: warn