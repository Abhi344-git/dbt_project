version: 2

###############################################################################
# SOURCES
###############################################################################

sources:
  - name: SN_CITI_1
    description: "Landing schema containing raw transaction files."

    database: "{{ var('source_database') }}"
    schema: "{{ var('source_schema') }}"

    freshness:
      warn_after:
        count: 1
        period: day
      error_after:
        count: 2
        period: day

    loaded_at_field: TRANSACTION_DATE

    tables:
      - name: transaction_raw
        description: "Raw transaction data received from source."

        columns:

          - name: TRANSACTION_ID
            description: "Unique transaction identifier from source."
            tests:
              - not_null:
                  severity: warn

          - name: CUSTOMER_ID
            description: "Customer identifier."
            tests:
              - not_null:
                  severity: warn

          - name: BRANCH_ID
            description: "Branch identifier."
            tests:
              - not_null:
                  severity: warn

          - name: AMOUNT
            description: "Transaction amount."

            tests:
              - not_null:
                  severity: warn

              - dbt_utils.accepted_range:
                  min_value: 0
                  max_value: 1000000
                  severity: warn

          - name: TRANSACTION_TYPE
            description: "Transaction type."

            tests:
              - not_null:
                  severity: warn

              - accepted_values:
                  values:
                    - DEBIT
                    - CREDIT
                  severity: warn

          - name: TRANSACTION_DATE
            description: "Date of transaction."

            tests:
              - not_null:
                  severity: warn

          - name: CURRENCY
            description: "Currency code."

            tests:
              - not_null:
                  severity: warn

              - accepted_values:
                  values:
                    - INR
                    - USD
                    - EUR
                  severity: warn

###############################################################################
# MODELS
###############################################################################

models:
  - name: transaction_bronze
    description: "Bronze layer after incremental loading and deduplication."

    columns:

      - name: TRANSACTION_ID
        description: "Primary key after Bronze deduplication."

        tests:
          - unique:
              severity: warn

          - not_null:
              severity: warn